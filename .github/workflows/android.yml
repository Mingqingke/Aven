name: Android CI

on:
  workflow_dispatch:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare SDK
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          SDKMANAGER=$(ls $ANDROID_SDK_ROOT/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1 || true
          fi
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon
      - name: Build debug
        run: ./gradlew assembleDebug --no-daemon
      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: aven-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Decode keystore
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/aven-release.jks
      - name: Write signing config
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cat > keystore.properties <<PROPS
          storeFile=app/aven-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS
      - name: Build release
        if: startsWith(github.ref, 'refs/tags/')
        run: ./gradlew assembleRelease --no-daemon
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
